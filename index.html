<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Log - Provisions, Storehouse & Inventory</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Press Start 2P', cursive;
      background: #1a1a2e;
      min-height: 100vh;
      padding: 20px 14px 40px;
      color: #ffd700;
    }

    .main-wrapper {
      max-width: 780px;
      margin: 0 auto;
    }

    /* Vault Header & Sync Toolbar */
    .vault-header-card {
      background: #2a2a3e;
      border: 2px solid #4a4a5e;
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-title {
      font-size: 14px;
      color: #ffd700;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #c9a227;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid;
      background: #1a1a2e;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .status-synced   { color: #7fff7f; border-color: #3a6a3a; }
    .status-syncing  { color: #ffd700; border-color: #c9a227; }
    .status-local    { color: #80d8ff; border-color: #0091ea; }
    .status-error    { color: #ff5252; border-color: #d50000; }

    .error-detail {
      font-size: 7px;
      color: #ff5252;
      background: #2a1a1a;
      border: 1px solid #d50000;
      border-radius: 4px;
      padding: 8px 10px;
      margin-top: 8px;
      word-break: break-all;
      display: none;
    }

    .error-detail.visible {
      display: block;
    }

    .icon-btn {
      background: #1a1a2e;
      border: 2px solid #5c4033;
      color: #ffd700;
      padding: 6px 10px;
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    }

    /* Tabs Navigation */
    .tabs-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: #202030;
      border: 2px solid #4a4a5e;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      padding: 12px 6px;
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      color: #8a8a9e;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .tab-btn:hover {
      background: #28283c;
      color: #ffd700;
    }

    .tab-btn.active {
      background: #2a2a3e;
      color: #ffd700;
      border-color: #ffd700;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #c9a227;
      box-shadow: 0 -4px 12px rgba(255, 215, 0, 0.2);
    }

    .tab-count-badge {
      font-size: 7px;
      padding: 2px 6px;
      background: #1a1a2e;
      border: 1px solid #5c4033;
      border-radius: 3px;
      color: #d4c4a8;
    }

    .tab-btn.active .tab-count-badge {
      border-color: #ffd700;
      color: #ffd700;
    }

    /* Vault Card */
    .vault-card {
      background: #2a2a3e;
      border: 2px solid #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.25);
      border-radius: 0 0 6px 6px;
      padding: 18px;
    }

    .input-box {
      background: #1a1a2e;
      padding: 12px;
      border: 2px solid #4a4a5e;
      border-radius: 4px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"], select {
      background: #d4c4a8;
      color: #3d2914;
      border: 2px solid #5c4033;
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      padding: 10px;
      border-radius: 4px;
    }

    input[type="text"] {
      width: 100%;
    }

    select {
      cursor: pointer;
      font-size: 9px;
      flex: 1;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }

    input[type="text"]::placeholder {
      color: #7a6a5a;
    }

    .add-btn {
      background: #2a4a2a;
      border: 2px solid #3a6a3a;
      color: #7fff7f;
      padding: 10px 14px;
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      cursor: pointer;
      border-radius: 4px;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .add-btn:hover {
      background: #3a5a3a;
      box-shadow: 0 0 8px rgba(127, 255, 127, 0.5);
    }

    /* Label Group Section */
    .label-group-block {
      margin-bottom: 16px;
    }

    .label-group-header {
      font-size: 9px;
      padding: 6px 8px;
      margin-bottom: 8px;
      border-left: 4px solid #ffd700;
      background: #1f1f30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.5px;
    }

    .label-group-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 10px;
    }

    /* Item Card */
    .item-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      background: #1a1a2e;
      border: 2px solid #4a4a5e;
      border-radius: 4px;
      transition: border-color 0.15s, background 0.15s;
    }

    .item-card.dragging {
      opacity: 0.3;
      border: 2px dashed #ffd700;
      background: #2a2a3e;
    }

    .item-card.drag-target-above {
      border-top: 3px solid #ffd700 !important;
    }

    .item-card.drag-target-below {
      border-bottom: 3px solid #ffd700 !important;
    }

    .drag-handle {
      color: #7a6a5a;
      font-size: 12px;
      padding: 2px 4px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .drag-handle:active {
      cursor: grabbing;
      color: #ffd700;
    }

    .item-checkbox {
      width: 18px;
      height: 18px;
      background: #d4c4a8;
      border: 2px solid #5c4033;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #3d2914;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-content {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      overflow: hidden;
    }

    .item-text {
      font-size: 9px;
      color: #d4c4a8;
      word-break: break-word;
      line-height: 1.4;
    }

    .item-tag {
      font-size: 7px;
      padding: 3px 5px;
      border-radius: 2px;
      flex-shrink: 0;
      text-transform: uppercase;
      border: 1px solid;
    }

    /* Tag styles */
    .tag-produce { background: #1c381c; color: #7fff7f; border-color: #3a6a3a; }
    .tag-meat    { background: #3d1c1c; color: #ff7f7f; border-color: #6a3a3a; }
    .tag-cold    { background: #1a334a; color: #7fe5ff; border-color: #2b557b; }
    .tag-dry     { background: #3d341a; color: #ffd87f; border-color: #6a5a2b; }
    .tag-snacks  { background: #3b1d3d; color: #ff7fe5; border-color: #6b336e; }

    .tag-gear       { background: #2f2a4a; color: #c4b5fd; border-color: #554a8a; }
    .tag-tools      { background: #3d2f1f; color: #fbc02d; border-color: #6d5336; }
    .tag-consumable { background: #1a3d31; color: #4db6ac; border-color: #2e6d58; }
    .tag-ammo       { background: #421e1e; color: #ff8a80; border-color: #7b3838; }

    .tag-quest      { background: #3a3214; color: #ffd700; border-color: #705e19; }
    .tag-loot       { background: #1f3a2c; color: #69f0ae; border-color: #356b4f; }
    .tag-note       { background: #383430; color: #cfd8dc; border-color: #5d5954; }
    .tag-general    { background: #2a2a3e; color: #d4c4a8; border-color: #4a4a5e; }

    .delete-btn {
      background: #8b0000;
      border: 2px solid #a00;
      color: #fff;
      padding: 5px 8px;
      font-family: 'Press Start 2P', cursive;
      font-size: 8px;
      cursor: pointer;
      border-radius: 3px;
      opacity: 0.3;
      transition: opacity 0.15s, background 0.15s;
    }

    .item-card:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      background: #a00;
      box-shadow: 0 0 6px rgba(255, 0, 0, 0.6);
    }

    /* Completed section */
    .completed-section {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 2px dashed #4a4a5e;
    }

    .completed-header {
      font-size: 9px;
      color: #7a7a8a;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .item-card.completed {
      opacity: 0.55;
      border-color: #2e4a2e;
      background: #141424;
    }

    .item-card.completed .item-checkbox {
      background: #2a4a2a;
      border-color: #7fff7f;
      color: #7fff7f;
    }

    .item-card.completed .item-text {
      text-decoration: line-through;
      color: #7a7a8a;
    }

    .empty-state {
      font-size: 8px;
      color: #6a6a7e;
      text-align: center;
      padding: 24px 8px;
      border: 1px dashed #3a3a4e;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <!-- TOP BAR -->
    <header class="vault-header-card">
      <div class="header-top-row">
        <div class="header-title">📜 QUEST LOG VAULT</div>
        <div class="header-actions">
          <span class="status-badge status-local" id="sync-status" onclick="toggleErrorDetail()" title="Click for details">💾 LOCAL ONLY</span>
          <button class="icon-btn" onclick="syncWithGithub()" title="Sync memory now">🔄 SYNC</button>
        </div>
      </div>
      <div class="error-detail" id="error-detail"></div>
    </header>

    <!-- TABS NAVIGATION -->
    <nav class="tabs-nav">
      <button class="tab-btn active" id="tab-btn-food" onclick="switchTab('food')">
        <span>🍖 PROVISIONS</span>
        <span class="tab-count-badge" id="tab-count-food">0</span>
      </button>
      <button class="tab-btn" id="tab-btn-supplies" onclick="switchTab('supplies')">
        <span>📦 STOREHOUSE</span>
        <span class="tab-count-badge" id="tab-count-supplies">0</span>
      </button>
      <button class="tab-btn" id="tab-btn-misc" onclick="switchTab('misc')">
        <span>🎒 INVENTORY</span>
        <span class="tab-count-badge" id="tab-count-misc">0</span>
      </button>
    </nav>

    <!-- ACTIVE TAB CONTENT -->
    <div class="vault-card">
      <div class="input-box">
        <input type="text" id="quest-input" placeholder="Item name..." />
        <div class="input-row">
          <select id="tag-select"></select>
          <button class="add-btn" onclick="addItem()">➕ ADD</button>
        </div>
      </div>

      <div id="active-list-container"></div>

      <div class="completed-section" id="completed-section" style="display:none;">
        <div class="completed-header">
          <span>✅ COMPLETED / SECURED</span>
          <span id="completed-count">0</span>
        </div>
        <div id="completed-list-container"></div>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // EMBEDDED GITHUB CONFIG - Edit these values
    // ============================================
    const GITHUB_CONFIG = {
      owner: 'GeoPOS-90',
      repo: 'Questlog',
      branch: 'main',
      path: 'todos',
      token: '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'
    };

    // Auto-poll interval (in milliseconds) - 30 seconds
    const AUTO_POLL_INTERVAL = 30000;

    // ============================================
    // DEBUG HELPERS
    // ============================================
    let lastError = null;

    function logDebug(context, data) {
      console.log(`[QuestLog Debug] ${context}:`, data);
    }

    function setError(message, details = null) {
      lastError = { message, details, timestamp: new Date().toISOString() };
      console.error('[QuestLog Error]', message, details);

      const errorEl = document.getElementById('error-detail');
      errorEl.innerHTML = `<strong>${message}</strong>${details ? '<br>' + escapeHtml(JSON.stringify(details, null, 2)) : ''}`;
      errorEl.classList.add('visible');
    }

    function clearError() {
      lastError = null;
      const errorEl = document.getElementById('error-detail');
      errorEl.classList.remove('visible');
      errorEl.innerHTML = '';
    }

    function toggleErrorDetail() {
      const errorEl = document.getElementById('error-detail');
      if (lastError) {
        errorEl.classList.toggle('visible');
      }
    }

    function validateConfig() {
      const cfg = GITHUB_CONFIG;
      const issues = [];

      if (!cfg.owner) issues.push('Missing owner');
      if (!cfg.repo) issues.push('Missing repo');
      if (!cfg.branch) issues.push('Missing branch');
      if (!cfg.path) issues.push('Missing path');
      if (!cfg.token) issues.push('Missing token');
      else if (cfg.token.length < 40) issues.push(`Token too short (${cfg.token.length} chars, expected 40+)`);
      else if (cfg.token.includes(' ')) issues.push('Token contains spaces');

      logDebug('Config Validation', {
        owner: cfg.owner,
        repo: cfg.repo,
        branch: cfg.branch,
        path: cfg.path,
        tokenLength: cfg.token ? cfg.token.length : 0,
        tokenPrefix: cfg.token ? cfg.token.substring(0, 15) + '...' : 'MISSING',
        issues: issues.length ? issues : 'NONE'
      });

      return issues;
    }

    // ============================================

    const STORAGE_DATA_KEY = 'questlog_vault_data_v3';
    const ACTIVE_TAB_KEY   = 'questlog_vault_active_tab';

    const CATEGORY_CONFIG = {
      food: {
        name: 'Provisions',
        labels: ['Produce', 'Meat', 'Cold', 'Dry', 'Snacks'],
        placeholder: 'Food item (e.g. Fresh Apples)...'
      },
      supplies: {
        name: 'Storehouse',
        labels: ['Gear', 'Tools', 'Consumable', 'Ammo', 'General'],
        placeholder: 'Supply item (e.g. Torches, Iron Nails)...'
      },
      misc: {
        name: 'Inventory',
        labels: ['Quest', 'Loot', 'Note', 'General'],
        placeholder: 'General item or note...'
      }
    };

    let currentTab = localStorage.getItem(ACTIVE_TAB_KEY) || 'food';
    let draggedId = null;
    let currentSha = null;
    let isSyncing = false;
    let autoPollTimer = null;

    // Load Local Data
    function getStore() {
      try {
        const raw = localStorage.getItem(STORAGE_DATA_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {
        console.error('Storage read error:', e);
      }
      return { food: [], supplies: [], misc: [] };
    }

    function saveStoreLocal(data) {
      localStorage.setItem(STORAGE_DATA_KEY, JSON.stringify(data));
    }

    // Config helper - now returns embedded config
    function getGithubConfig() {
      return GITHUB_CONFIG;
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).substring(2, 7);
    }

    function escapeHtml(str) {
      const p = document.createElement('p');
      p.textContent = str || '';
      return p.innerHTML;
    }

    function updateStatus(state, label) {
      const el = document.getElementById('sync-status');
      el.className = `status-badge status-${state}`;
      el.textContent = label;

      if (state !== 'error') {
        clearError();
      }
    }

    /* GitHub Sync Engine */
    async function syncWithGithub(silent = false) {
      const cfg = getGithubConfig();

      // Validate config first
      const configIssues = validateConfig();
      if (configIssues.length > 0) {
        setError('Config Issues', configIssues);
        updateStatus('error', '⚠️ CONFIG ERROR');
        return;
      }

      if (!cfg.token) {
        updateStatus('local', '💾 LOCAL ONLY');
        return;
      }

      if (isSyncing) return;
      isSyncing = true;
      if (!silent) updateStatus('syncing', '🔄 SYNCING...');

      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}?ref=${cfg.branch}`;
      logDebug('Fetch URL', url);

      try {
        const res = await fetch(url, {
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        logDebug('Response Status', { status: res.status, statusText: res.statusText });

        if (res.status === 200) {
          const body = await res.json();
          currentSha = body.sha;
          logDebug('File SHA', currentSha);

          // Decode utf8 from base64
          const decoded = decodeURIComponent(escape(atob(body.content.replace(/\s/g, ''))));
          const remoteData = JSON.parse(decoded);
          logDebug('Remote Data', remoteData);

          saveStoreLocal(remoteData);
          render();
          updateStatus('synced', '☁️ SYNCED');
        } else if (res.status === 404) {
          logDebug('File Not Found', 'Creating new file...');
          // File does not exist yet: push initial structure
          await pushToGithub(getStore());
        } else {
          // Get error details from response
          let errorBody = null;
          try {
            errorBody = await res.json();
          } catch (e) {
            errorBody = await res.text();
          }

          setError(`Sync Failed (HTTP ${res.status})`, {
            status: res.status,
            statusText: res.statusText,
            url: url,
            response: errorBody
          });
          updateStatus('error', '⚠️ SYNC ERROR');
        }
      } catch (err) {
        setError('Network/Fetch Error', {
          message: err.message,
          stack: err.stack
        });
        updateStatus('error', '⚠️ SYNC ERROR');
      } finally {
        isSyncing = false;
      }
    }

    async function pushToGithub(data) {
      const cfg = getGithubConfig();
      if (!cfg.token) {
        updateStatus('local', '💾 LOCAL ONLY');
        return;
      }

      updateStatus('syncing', '🔄 PUSHING...');
      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
      const jsonStr = JSON.stringify(data, null, 2);
      // Encode utf8 to base64
      const content = btoa(unescape(encodeURIComponent(jsonStr)));

      const payload = {
        message: 'Update Quest Log memory',
        content: content,
        branch: cfg.branch
      };
      if (currentSha) payload.sha = currentSha;

      logDebug('Push Payload', { url, hasSha: !!currentSha, contentLength: content.length });

      try {
        const res = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${cfg.token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        logDebug('Push Response', { status: res.status, statusText: res.statusText });

        if (res.ok) {
          const body = await res.json();
          currentSha = body.content.sha;
          logDebug('New SHA after push', currentSha);
          updateStatus('synced', '☁️ SYNCED');
        } else if (res.status === 409) {
          logDebug('Conflict detected', 'Fetching newer version...');
          // Conflict: fetch newer version first
          await syncWithGithub(true);
        } else {
          // Get error details from response
          let errorBody = null;
          try {
            errorBody = await res.json();
          } catch (e) {
            errorBody = await res.text();
          }

          setError(`Push Failed (HTTP ${res.status})`, {
            status: res.status,
            statusText: res.statusText,
            url: url,
            response: errorBody
          });
          updateStatus('error', '⚠️ PUSH ERROR');
        }
      } catch (err) {
        setError('Push Network Error', {
          message: err.message,
          stack: err.stack
        });
        updateStatus('error', '⚠️ PUSH ERROR');
      }
    }

    function saveAndSync(data) {
      saveStoreLocal(data);
      render();
      pushToGithub(data);
    }

    /* Auto-Poll for remote changes */
    function startAutoPoll() {
      if (autoPollTimer) clearInterval(autoPollTimer);
      autoPollTimer = setInterval(() => {
        syncWithGithub(true); // silent sync
      }, AUTO_POLL_INTERVAL);
      logDebug('Auto-poll started', `${AUTO_POLL_INTERVAL / 1000} seconds interval`);
    }

    function stopAutoPoll() {
      if (autoPollTimer) {
        clearInterval(autoPollTimer);
        autoPollTimer = null;
        logDebug('Auto-poll stopped', null);
      }
    }

    /* Tabs */
    function switchTab(tabKey) {
      currentTab = tabKey;
      localStorage.setItem(ACTIVE_TAB_KEY, tabKey);

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-btn-${tabKey}`);
      if (activeBtn) activeBtn.classList.add('active');

      updateTagSelect();
      render();
    }

    function updateTagSelect() {
      const select = document.getElementById('tag-select');
      const input = document.getElementById('quest-input');
      const cfg = CATEGORY_CONFIG[currentTab];

      select.innerHTML = cfg.labels.map(lbl => `<option value="${lbl}">${lbl}</option>`).join('');
      input.placeholder = cfg.placeholder;
      input.value = '';
      input.focus();
    }

    /* Actions */
    function addItem() {
      const input = document.getElementById('quest-input');
      const select = document.getElementById('tag-select');
      const text = input.value.trim();
      if (!text) return;

      const data = getStore();
      if (!data[currentTab]) data[currentTab] = [];

      data[currentTab].push({
        id: uid(),
        text: text,
        tag: select.value,
        completed: false,
        createdAt: Date.now()
      });

      input.value = '';
      saveAndSync(data);
    }

    function toggleItem(id) {
      const data = getStore();
      const list = data[currentTab] || [];
      const item = list.find(it => it.id === id);
      if (item) {
        item.completed = !item.completed;
        saveAndSync(data);
      }
    }

    function deleteItem(id, e) {
      e.stopPropagation();
      const data = getStore();
      data[currentTab] = (data[currentTab] || []).filter(it => it.id !== id);
      saveAndSync(data);
    }

    /* Drag & Drop */
    function onDragStart(e, id) {
      draggedId = id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', id);
      const card = e.currentTarget;
      setTimeout(() => card.classList.add('dragging'), 0);
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.item-card').forEach(c => {
        c.classList.remove('drag-target-above', 'drag-target-below');
      });
      draggedId = null;
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const card = e.currentTarget;
      if (!card || card.dataset.id === draggedId) return;

      const rect = card.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;

      document.querySelectorAll('.item-card').forEach(c => {
        c.classList.remove('drag-target-above', 'drag-target-below');
      });

      if (e.clientY < mid) {
        card.classList.add('drag-target-above');
      } else {
        card.classList.add('drag-target-below');
      }
    }

    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-target-above', 'drag-target-below');
    }

    function onDrop(e, targetId) {
      e.preventDefault();
      e.stopPropagation();

      document.querySelectorAll('.item-card').forEach(c => {
        c.classList.remove('drag-target-above', 'drag-target-below');
      });

      if (!draggedId || draggedId === targetId) return;

      const data = getStore();
      const list = data[currentTab] || [];

      const dragIndex = list.findIndex(it => it.id === draggedId);
      const targetIndex = list.findIndex(it => it.id === targetId);
      if (dragIndex === -1 || targetIndex === -1) return;

      const [draggedItem] = list.splice(dragIndex, 1);
      const targetItem = list.find(it => it.id === targetId);

      if (targetItem && draggedItem.tag !== targetItem.tag) {
        draggedItem.tag = targetItem.tag;
      }

      const rect = e.currentTarget.getBoundingClientRect();
      const isAbove = e.clientY < (rect.top + rect.height / 2);
      const newIndex = list.findIndex(it => it.id === targetId);

      list.splice(isAbove ? newIndex : newIndex + 1, 0, draggedItem);
      saveAndSync(data);
    }

    function renderItemCard(item) {
      const tagClass = `tag-${item.tag.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
      return `
        <div class="item-card ${item.completed ? 'completed' : ''}"
             id="card-${item.id}"
             data-id="${item.id}"
             draggable="true"
             ondragstart="onDragStart(event, '${item.id}')"
             ondragend="onDragEnd(event)"
             ondragover="onDragOver(event)"
             ondragleave="onDragLeave(event)"
             ondrop="onDrop(event, '${item.id}')">
          <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
          <div class="item-checkbox" onclick="toggleItem('${item.id}')">${item.completed ? '✓' : ''}</div>
          <div class="item-content" onclick="toggleItem('${item.id}')">
            <span class="item-tag ${tagClass}">${escapeHtml(item.tag)}</span>
            <span class="item-text">${escapeHtml(item.text)}</span>
          </div>
          <button class="delete-btn" title="Delete" onclick="deleteItem('${item.id}', event)">✕</button>
        </div>
      `;
    }

    function render() {
      const data = getStore();
      const config = CATEGORY_CONFIG[currentTab];

      Object.keys(CATEGORY_CONFIG).forEach(cat => {
        const activeCount = (data[cat] || []).filter(it => !it.completed).length;
        const badge = document.getElementById(`tab-count-${cat}`);
        if (badge) badge.textContent = activeCount;
      });

      const currentList = data[currentTab] || [];
      const activeItems = currentList.filter(it => !it.completed);
      const completedItems = currentList.filter(it => it.completed);

      const activeContainer = document.getElementById('active-list-container');
      const completedContainer = document.getElementById('completed-list-container');
      const completedSection = document.getElementById('completed-section');
      const completedCount = document.getElementById('completed-count');

      if (activeItems.length === 0) {
        activeContainer.innerHTML = '<div class="empty-state">NO ACTIVE ITEMS IN THIS HALL</div>';
      } else {
        let html = '';
        config.labels.forEach(label => {
          const groupItems = activeItems.filter(it => it.tag.toLowerCase() === label.toLowerCase());
          if (groupItems.length > 0) {
            html += `
              <div class="label-group-block">
                <div class="label-group-header">
                  <span>${label.toUpperCase()}</span>
                  <span>(${groupItems.length})</span>
                </div>
                <div class="label-group-list">
                  ${groupItems.map(renderItemCard).join('')}
                </div>
              </div>
            `;
          }
        });

        const knownLabels = config.labels.map(l => l.toLowerCase());
        const otherItems = activeItems.filter(it => !knownLabels.includes(it.tag.toLowerCase()));
        if (otherItems.length > 0) {
          html += `
            <div class="label-group-block">
              <div class="label-group-header">
                <span>OTHER</span>
                <span>(${otherItems.length})</span>
              </div>
              <div class="label-group-list">
                ${otherItems.map(renderItemCard).join('')}
              </div>
            </div>
          `;
        }

        activeContainer.innerHTML = html;
      }

      if (completedItems.length > 0) {
        completedSection.style.display = 'block';
        completedCount.textContent = completedItems.length;
        completedContainer.innerHTML = completedItems.map(renderItemCard).join('');
      } else {
        completedSection.style.display = 'none';
        completedContainer.innerHTML = '';
      }
    }

    // Enter Key
    document.getElementById('quest-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addItem();
    });

    // Startup
    logDebug('App Starting', { timestamp: new Date().toISOString() });
    validateConfig(); // Log config validation on startup
    switchTab(currentTab);
    syncWithGithub();
    startAutoPoll(); // Start auto-polling every 30 seconds
  </script>
</body>
</html>
