<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Log - Main Quest, Side Quest, Provisions, Storehouse & Inventory</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Press Start 2P', cursive;
      background: #1a1a2e;
      min-height: 100vh;
      padding: 20px 14px 40px;
      color: #ffd700;
    }

    .main-wrapper {
      max-width: 780px;
      margin: 0 auto;
    }

    /* Vault Header & Sync Toolbar */
    .vault-header-card {
      background: #2a2a3e;
      border: 2px solid #4a4a5e;
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-title {
      font-size: 14px;
      color: #ffd700;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #c9a227;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid;
      background: #1a1a2e;
      letter-spacing: 0.5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .status-synced   { color: #7fff7f; border-color: #3a6a3a; }
    .status-syncing  { color: #ffd700; border-color: #c9a227; }
    .status-local    { color: #80d8ff; border-color: #0091ea; }
    .status-error    { color: #ff5252; border-color: #d50000; }

    .sync-timestamp {
      font-size: 6px;
      color: #7a7a8a;
      margin-top: 2px;
    }

    @keyframes syncPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-badge.pulsing {
      animation: syncPulse 1s ease-in-out;
    }

    .icon-btn {
      background: #1a1a2e;
      border: 2px solid #5c4033;
      color: #ffd700;
      padding: 6px 10px;
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    }

    .icon-btn.small {
      font-size: 7px;
      padding: 4px 8px;
    }

    /* Search Box */
    .search-container {
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      background: #1a1a2e;
      color: #ffd700;
      border: 2px solid #4a4a5e;
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      padding: 10px 12px;
      border-radius: 4px;
    }

    .search-input:focus {
      outline: none;
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }

    .search-input::placeholder {
      color: #5a5a6e;
    }

    .search-results-info {
      font-size: 7px;
      color: #7a7a8a;
      margin-top: 6px;
      padding-left: 4px;
    }

    /* Tabs Navigation */
    .tabs-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: #202030;
      border: 2px solid #4a4a5e;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      padding: 10px 4px;
      font-family: 'Press Start 2P', cursive;
      font-size: 7px;
      color: #8a8a9e;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .tab-btn:hover {
      background: #28283c;
      color: #ffd700;
    }

    .tab-btn.active {
      background: #2a2a3e;
      color: #ffd700;
      border-color: #ffd700;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #c9a227;
      box-shadow: 0 -4px 12px rgba(255, 215, 0, 0.2);
    }

    .tab-count-badge {
      font-size: 6px;
      padding: 2px 5px;
      background: #1a1a2e;
      border: 1px solid #5c4033;
      border-radius: 3px;
      color: #d4c4a8;
    }

    .tab-btn.active .tab-count-badge {
      border-color: #ffd700;
      color: #ffd700;
    }

    /* Vault Card */
    .vault-card {
      background: #2a2a3e;
      border: 2px solid #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.25);
      border-radius: 0 0 6px 6px;
      padding: 18px;
    }

    .input-box {
      background: #1a1a2e;
      padding: 12px;
      border: 2px solid #4a4a5e;
      border-radius: 4px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"], select {
      background: #d4c4a8;
      color: #3d2914;
      border: 2px solid #5c4033;
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      padding: 10px;
      border-radius: 4px;
    }

    input[type="text"] {
      width: 100%;
    }

    select {
      cursor: pointer;
      font-size: 9px;
      flex: 1;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }

    input[type="text"]::placeholder {
      color: #7a6a5a;
    }

    .add-btn {
      background: #2a4a2a;
      border: 2px solid #3a6a3a;
      color: #7fff7f;
      padding: 10px 14px;
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      cursor: pointer;
      border-radius: 4px;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .add-btn:hover {
      background: #3a5a3a;
      box-shadow: 0 0 8px rgba(127, 255, 127, 0.5);
    }

    /* Label Group Section */
    .label-group-block {
      margin-bottom: 16px;
    }

    .label-group-header {
      font-size: 9px;
      padding: 6px 8px;
      margin-bottom: 8px;
      border-left: 4px solid #ffd700;
      background: #1f1f30;
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 0.5px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .label-group-header:hover {
      background: #252540;
    }

    .label-group-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .collapse-icon {
      font-size: 8px;
      transition: transform 0.2s;
    }

    .label-group-header.collapsed .collapse-icon {
      transform: rotate(-90deg);
    }

    .label-group-header .edit-label-btn {
      font-size: 7px;
      padding: 2px 5px;
      background: transparent;
      border: 1px solid #5c4033;
      color: #7a7a8a;
      cursor: pointer;
      border-radius: 2px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .label-group-header:hover .edit-label-btn {
      opacity: 1;
    }

    .label-group-header .edit-label-btn:hover {
      border-color: #ffd700;
      color: #ffd700;
    }

    .label-group-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 10px;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .label-group-list.collapsed {
      max-height: 0 !important;
      margin: 0;
    }

    .add-category-btn {
      background: transparent;
      border: 2px dashed #4a4a5e;
      color: #5a5a6e;
      padding: 8px;
      font-family: 'Press Start 2P', cursive;
      font-size: 7px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
      margin-top: 8px;
      transition: all 0.15s;
    }

    .add-category-btn:hover {
      border-color: #7fff7f;
      color: #7fff7f;
    }

    /* Item Card */
    .item-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      background: #1a1a2e;
      border: 2px solid #4a4a5e;
      border-radius: 4px;
      transition: border-color 0.15s, background 0.15s;
    }

    .item-card.dragging {
      opacity: 0.3;
      border: 2px dashed #ffd700;
      background: #2a2a3e;
    }

    .item-card.drag-target-above {
      border-top: 3px solid #ffd700 !important;
    }

    .item-card.drag-target-below {
      border-bottom: 3px solid #ffd700 !important;
    }

    .item-card.search-highlight {
      border-color: #ffd700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.4);
    }

    .drag-handle {
      color: #7a6a5a;
      font-size: 12px;
      padding: 2px 4px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .drag-handle:active {
      cursor: grabbing;
      color: #ffd700;
    }

    .item-checkbox {
      width: 18px;
      height: 18px;
      background: #d4c4a8;
      border: 2px solid #5c4033;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #3d2914;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item-content {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      overflow: hidden;
    }

    .item-text {
      font-size: 9px;
      color: #d4c4a8;
      word-break: break-word;
      line-height: 1.4;
    }

    .item-tag {
      font-size: 7px;
      padding: 3px 5px;
      border-radius: 2px;
      flex-shrink: 0;
      text-transform: uppercase;
      border: 1px solid;
    }

    /* Tag styles */
    .tag-produce { background: #1c381c; color: #7fff7f; border-color: #3a6a3a; }
    .tag-meat    { background: #3d1c1c; color: #ff7f7f; border-color: #6a3a3a; }
    .tag-cold    { background: #1a334a; color: #7fe5ff; border-color: #2b557b; }
    .tag-dry     { background: #3d341a; color: #ffd87f; border-color: #6a5a2b; }
    .tag-snacks  { background: #3b1d3d; color: #ff7fe5; border-color: #6b336e; }

    .tag-gear       { background: #2f2a4a; color: #c4b5fd; border-color: #554a8a; }
    .tag-tools      { background: #3d2f1f; color: #fbc02d; border-color: #6d5336; }
    .tag-consumable { background: #1a3d31; color: #4db6ac; border-color: #2e6d58; }
    .tag-ammo       { background: #421e1e; color: #ff8a80; border-color: #7b3838; }

    .tag-quest      { background: #3a3214; color: #ffd700; border-color: #705e19; }
    .tag-loot       { background: #1f3a2c; color: #69f0ae; border-color: #356b4f; }
    .tag-note       { background: #383430; color: #cfd8dc; border-color: #5d5954; }
    .tag-general    { background: #2a2a3e; color: #d4c4a8; border-color: #4a4a5e; }

    /* New tab tags */
    .tag-story      { background: #3a2a14; color: #ffb74d; border-color: #6d4c1f; }
    .tag-boss       { background: #4a1a2a; color: #ff5252; border-color: #7b2d3d; }
    .tag-dungeon    { background: #1a2a4a; color: #64b5f6; border-color: #2d4a7b; }
    .tag-escort     { background: #2a3a2a; color: #81c784; border-color: #4a6a4a; }
    .tag-fetch      { background: #3a3a2a; color: #dce775; border-color: #5a5a3a; }
    .tag-explore    { background: #2a2a3a; color: #b39ddb; border-color: #4a4a6a; }
    .tag-hunt       { background: #3a2a2a; color: #ef9a9a; border-color: #6a4a4a; }
    .tag-collect    { background: #2a3a3a; color: #80deea; border-color: #4a6a6a; }

    .delete-btn {
      background: #8b0000;
      border: 2px solid #a00;
      color: #fff;
      padding: 5px 8px;
      font-family: 'Press Start 2P', cursive;
      font-size: 8px;
      cursor: pointer;
      border-radius: 3px;
      opacity: 0.3;
      transition: opacity 0.15s, background 0.15s;
    }

    .item-card:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      background: #a00;
      box-shadow: 0 0 6px rgba(255, 0, 0, 0.6);
    }

    /* Completed section */
    .completed-section {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 2px dashed #4a4a5e;
    }

    .completed-header {
      font-size: 9px;
      color: #7a7a8a;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .item-card.completed {
      opacity: 0.55;
      border-color: #2e4a2e;
      background: #141424;
    }

    .item-card.completed .item-checkbox {
      background: #2a4a2a;
      border-color: #7fff7f;
      color: #7fff7f;
    }

    .item-card.completed .item-text {
      text-decoration: line-through;
      color: #7a7a8a;
    }

    .empty-state {
      font-size: 8px;
      color: #6a6a7e;
      text-align: center;
      padding: 24px 8px;
      border: 1px dashed #3a3a4e;
      border-radius: 4px;
    }

    /* Modal for editing labels */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #2a2a3e;
      border: 2px solid #ffd700;
      border-radius: 6px;
      padding: 20px;
      max-width: 400px;
      width: 90%;
    }

    .modal-title {
      font-size: 10px;
      color: #ffd700;
      margin-bottom: 16px;
      text-align: center;
    }

    .modal-input {
      width: 100%;
      background: #d4c4a8;
      color: #3d2914;
      border: 2px solid #5c4033;
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 16px;
    }

    .modal-input:focus {
      outline: none;
      border-color: #ffd700;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-btn {
      padding: 8px 16px;
      font-family: 'Press Start 2P', cursive;
      font-size: 8px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid;
    }

    .modal-btn.confirm {
      background: #2a4a2a;
      border-color: #3a6a3a;
      color: #7fff7f;
    }

    .modal-btn.cancel {
      background: #4a2a2a;
      border-color: #6a3a3a;
      color: #ff7f7f;
    }

    .modal-btn.danger {
      background: #8b0000;
      border-color: #a00;
      color: #fff;
    }

    /* Backup buttons */
    .backup-section {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    /* Conflict Modal */
    .conflict-info {
      font-size: 8px;
      color: #d4c4a8;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .conflict-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .conflict-btn {
      padding: 10px 16px;
      font-family: 'Press Start 2P', cursive;
      font-size: 8px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid;
      text-align: left;
    }

    .conflict-btn.local {
      background: #2a4a2a;
      border-color: #3a6a3a;
      color: #7fff7f;
    }

    .conflict-btn.remote {
      background: #2a2a4a;
      border-color: #3a3a6a;
      color: #7f7fff;
    }

    .conflict-btn.merge {
      background: #4a4a2a;
      border-color: #6a6a3a;
      color: #ffff7f;
    }

    /* Hidden file input */
    #import-file-input {
      display: none;
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <!-- TOP BAR -->
    <header class="vault-header-card">
      <div class="header-top-row">
        <div class="header-title">📜 QUEST LOG VAULT</div>
        <div class="header-actions">
          <div class="status-badge status-local" id="sync-status">
            <span id="sync-status-text">💾 LOCAL ONLY</span>
            <span class="sync-timestamp" id="sync-timestamp"></span>
          </div>
          <button class="icon-btn" onclick="syncWithGithub()" title="Sync memory now">🔄 SYNC</button>
        </div>
      </div>
      <div class="backup-section">
        <button class="icon-btn small" onclick="exportBackup()" title="Download backup">📥 EXPORT</button>
        <button class="icon-btn small" onclick="document.getElementById('import-file-input').click()" title="Import backup">📤 IMPORT</button>
        <input type="file" id="import-file-input" accept=".json" onchange="importBackup(event)">
      </div>
    </header>

    <!-- SEARCH -->
    <div class="search-container">
      <input type="text" class="search-input" id="search-input" placeholder="🔍 Search all quests..." oninput="handleSearch()">
      <div class="search-results-info" id="search-results-info"></div>
    </div>

    <!-- TABS NAVIGATION -->
    <nav class="tabs-nav">
      <button class="tab-btn" id="tab-btn-mainquest" onclick="switchTab('mainquest')">
        <span>⚔️ MAIN</span>
        <span class="tab-count-badge" id="tab-count-mainquest">0</span>
      </button>
      <button class="tab-btn" id="tab-btn-sidequest" onclick="switchTab('sidequest')">
        <span>🗡️ SIDE</span>
        <span class="tab-count-badge" id="tab-count-sidequest">0</span>
      </button>
      <button class="tab-btn active" id="tab-btn-food" onclick="switchTab('food')">
        <span>🍖 FOOD</span>
        <span class="tab-count-badge" id="tab-count-food">0</span>
      </button>
      <button class="tab-btn" id="tab-btn-supplies" onclick="switchTab('supplies')">
        <span>📦 SUPPLY</span>
        <span class="tab-count-badge" id="tab-count-supplies">0</span>
      </button>
      <button class="tab-btn" id="tab-btn-misc" onclick="switchTab('misc')">
        <span>🎒 INV</span>
        <span class="tab-count-badge" id="tab-count-misc">0</span>
      </button>
    </nav>

    <!-- ACTIVE TAB CONTENT -->
    <div class="vault-card">
      <div class="input-box">
        <input type="text" id="quest-input" placeholder="Item name..." />
        <div class="input-row">
          <select id="tag-select"></select>
          <button class="add-btn" onclick="addItem()">➕ ADD</button>
        </div>
      </div>

      <div id="active-list-container"></div>

      <button class="add-category-btn" onclick="openAddCategoryModal()">+ ADD CATEGORY</button>

      <div class="completed-section" id="completed-section" style="display:none;">
        <div class="completed-header">
          <span>✅ COMPLETED / SECURED</span>
          <span id="completed-count">0</span>
        </div>
        <div id="completed-list-container"></div>
      </div>
    </div>
  </div>

  <!-- Edit Label Modal -->
  <div class="modal-overlay" id="edit-label-modal">
    <div class="modal-box">
      <div class="modal-title" id="edit-label-title">EDIT CATEGORY</div>
      <input type="text" class="modal-input" id="edit-label-input" placeholder="Category name...">
      <div class="modal-buttons">
        <button class="modal-btn danger" id="delete-label-btn" onclick="deleteCategory()">🗑️ DELETE</button>
        <button class="modal-btn cancel" onclick="closeEditLabelModal()">CANCEL</button>
        <button class="modal-btn confirm" onclick="saveCategory()">SAVE</button>
      </div>
    </div>
  </div>

  <!-- Add Category Modal -->
  <div class="modal-overlay" id="add-category-modal">
    <div class="modal-box">
      <div class="modal-title">ADD NEW CATEGORY</div>
      <input type="text" class="modal-input" id="add-category-input" placeholder="Category name...">
      <div class="modal-buttons">
        <button class="modal-btn cancel" onclick="closeAddCategoryModal()">CANCEL</button>
        <button class="modal-btn confirm" onclick="confirmAddCategory()">ADD</button>
      </div>
    </div>
  </div>

  <!-- Conflict Resolution Modal -->
  <div class="modal-overlay" id="conflict-modal">
    <div class="modal-box">
      <div class="modal-title">⚠️ SYNC CONFLICT</div>
      <div class="conflict-info">
        Remote data has changed since your last sync. Choose how to resolve:
      </div>
      <div class="conflict-options">
        <button class="conflict-btn local" onclick="resolveConflict('local')">
          📱 KEEP LOCAL<br>
          <small>Overwrite remote with your changes</small>
        </button>
        <button class="conflict-btn remote" onclick="resolveConflict('remote')">
          ☁️ USE REMOTE<br>
          <small>Discard local and use remote data</small>
        </button>
        <button class="conflict-btn merge" onclick="resolveConflict('merge')">
          🔀 MERGE BOTH<br>
          <small>Combine items from both versions</small>
        </button>
      </div>
    </div>
  </div>

  <script>
    // ============================================
    // EMBEDDED GITHUB CONFIG - Edit these values
    // ============================================
    const _t = [
      'github_pat_11B33AJB',
      'Y0Bxt04NO4rX78_RQj1eUOyJ',
      'MmmrF4SzE999qwOvtH869pPX',

    ];

    // Load Local Data
    function getStore() {
      try {
        const raw = localStorage.getItem(STORAGE_DATA_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          return migrateData(data);
        }
      } catch (e) {
        console.error('Storage read error:', e);
      }
      return getDefaultData();
    }

    function getDefaultData() {
      return {
        mainquest: [],
        sidequest: [],
        food: [],
        supplies: [],
        misc: [],
        categoryConfig: JSON.parse(JSON.stringify(DEFAULT_CATEGORY_CONFIG)),
        meta: {
          lastModified: Date.now(),
          version: 2
        }
      };
    }

    function migrateData(data) {
      // Migrate from v1 format (no categoryConfig or meta)
      if (!data.meta || data.meta.version < 2) {
        console.log('Migrating data to v2 format...');

        // Add new tabs if missing
        if (!data.mainquest) data.mainquest = [];
        if (!data.sidequest) data.sidequest = [];

        // Add categoryConfig if missing
        if (!data.categoryConfig) {
          data.categoryConfig = JSON.parse(JSON.stringify(DEFAULT_CATEGORY_CONFIG));
        }

        // Add meta
        data.meta = {
          lastModified: Date.now(),
          version: 2
        };
      }

      return data;
    }

    function saveStoreLocal(data) {
      data.meta.lastModified = Date.now();
      localStorage.setItem(STORAGE_DATA_KEY, JSON.stringify(data));
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).substring(2, 7);
    }

    function escapeHtml(str) {
      const p = document.createElement('p');
      p.textContent = str || '';
      return p.innerHTML;
    }

    function updateStatus(state, label) {
      const el = document.getElementById('sync-status');
      const textEl = document.getElementById('sync-status-text');
      el.className = `status-badge status-${state}`;
      textEl.textContent = label;

      if (state === 'synced') {
        lastSyncTime = new Date();
        updateSyncTimestamp();
      }
    }

    function updateSyncTimestamp() {
      const el = document.getElementById('sync-timestamp');
      if (!lastSyncTime) {
        el.textContent = '';
        return;
      }

      const now = new Date();
      const diff = Math.floor((now - lastSyncTime) / 1000);

      if (diff < 60) {
        el.textContent = 'just now';
      } else if (diff < 3600) {
        const mins = Math.floor(diff / 60);
        el.textContent = `${mins}m ago`;
      } else {
        el.textContent = lastSyncTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      }
    }

    // Update timestamp every 30 seconds
    setInterval(updateSyncTimestamp, 30000);

    function triggerPulse() {
      const el = document.getElementById('sync-status');
      el.classList.add('pulsing');
      setTimeout(() => el.classList.remove('pulsing'), 1000);
    }

    /* GitHub Sync Engine */
    async function syncWithGithub(silent = false) {
      const cfg = GITHUB_CONFIG;
      const token = getToken();

      if (!token) {
        updateStatus('local', '💾 LOCAL ONLY');
        return;
      }

      if (isSyncing) return;
      isSyncing = true;
      if (!silent) updateStatus('syncing', '🔄 SYNCING...');
      if (silent) triggerPulse();

      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}?ref=${cfg.branch}`;

      try {
        const res = await fetch(url, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (res.status === 200) {
          const body = await res.json();
          const remoteSha = body.sha;
          const decoded = decodeURIComponent(escape(atob(body.content.replace(/\s/g, ''))));
          const remoteData = migrateData(JSON.parse(decoded));

          const localData = getStore();

          // Check for conflicts
          if (currentSha && currentSha !== remoteSha && localData.meta.lastModified > remoteData.meta.lastModified) {
            // Local has changes AND remote has different SHA
            pendingConflict = { localData, remoteData, remoteSha };
            showConflictModal();
            isSyncing = false;
            return;
          }

          currentSha = remoteSha;
          saveStoreLocal(remoteData);
          render();
          updateStatus('synced', '☁️ SYNCED');
        } else if (res.status === 404) {
          // File does not exist yet: push initial structure
          await pushToGithub(getStore());
        } else {
          const errorBody = await res.json().catch(() => ({}));
          console.error('Sync error:', res.status, errorBody);
          updateStatus('error', '⚠️ SYNC ERROR');
        }
      } catch (err) {
        console.error('Fetch error:', err);
        updateStatus('error', '⚠️ SYNC ERROR');
      } finally {
        isSyncing = false;
      }
    }

    async function pushToGithub(data, force = false) {
      const cfg = GITHUB_CONFIG;
      const token = getToken();

      if (!token) {
        updateStatus('local', '💾 LOCAL ONLY');
        return;
      }

      updateStatus('syncing', '🔄 PUSHING...');
      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
      const jsonStr = JSON.stringify(data, null, 2);
      const content = btoa(unescape(encodeURIComponent(jsonStr)));

      const payload = {
        message: 'Update Quest Log memory',
        content: content,
        branch: cfg.branch
      };
      if (currentSha && !force) payload.sha = currentSha;

      try {
        const res = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const body = await res.json();
          currentSha = body.content.sha;
          updateStatus('synced', '☁️ SYNCED');
        } else if (res.status === 409) {
          // Conflict: fetch newer version first
          await syncWithGithub(true);
        } else {
          const errorBody = await res.json().catch(() => ({}));
          console.error('Push error:', res.status, errorBody);
          updateStatus('error', '⚠️ PUSH ERROR');
        }
      } catch (err) {
        console.error('Push error:', err);
        updateStatus('error', '⚠️ PUSH ERROR');
      }
    }

    function saveAndSync(data) {
      saveStoreLocal(data);
      render();
      pushToGithub(data);
    }

    /* Conflict Resolution */
    function showConflictModal() {
      document.getElementById('conflict-modal').classList.add('active');
    }

    function closeConflictModal() {
      document.getElementById('conflict-modal').classList.remove('active');
      pendingConflict = null;
    }

    function resolveConflict(choice) {
      if (!pendingConflict) return;

      const { localData, remoteData, remoteSha } = pendingConflict;

      if (choice === 'local') {
        // Keep local, overwrite remote
        currentSha = remoteSha;
        pushToGithub(localData);
      } else if (choice === 'remote') {
        // Use remote, discard local
        currentSha = remoteSha;
        saveStoreLocal(remoteData);
        render();
        updateStatus('synced', '☁️ SYNCED');
      } else if (choice === 'merge') {
        // Merge: combine items from both
        const mergedData = mergeData(localData, remoteData);
        currentSha = remoteSha;
        saveAndSync(mergedData);
      }

      closeConflictModal();
    }

    function mergeData(local, remote) {
      const merged = JSON.parse(JSON.stringify(remote));

      const tabs = ['mainquest', 'sidequest', 'food', 'supplies', 'misc'];

      tabs.forEach(tab => {
        const remoteIds = new Set((remote[tab] || []).map(i => i.id));
        const localItems = local[tab] || [];

        // Add local items that don't exist in remote
        localItems.forEach(item => {
          if (!remoteIds.has(item.id)) {
            merged[tab].push(item);
          }
        });
      });

      // Merge category configs
      if (local.categoryConfig) {
        tabs.forEach(tab => {
          if (local.categoryConfig[tab]) {
            const localLabels = local.categoryConfig[tab].labels || [];
            const remoteLabels = merged.categoryConfig[tab]?.labels || [];

            localLabels.forEach(label => {
              if (!remoteLabels.includes(label)) {
                merged.categoryConfig[tab].labels.push(label);
              }
            });
          }
        });
      }

      merged.meta.lastModified = Date.now();
      return merged;
    }

    /* Auto-Poll for remote changes */
    function startAutoPoll() {
      if (autoPollTimer) clearInterval(autoPollTimer);
      autoPollTimer = setInterval(() => {
        syncWithGithub(true); // silent sync
      }, AUTO_POLL_INTERVAL);
    }

    function stopAutoPoll() {
      if (autoPollTimer) {
        clearInterval(autoPollTimer);
        autoPollTimer = null;
      }
    }

    /* Export/Import Backup */
    function exportBackup() {
      const data = getStore();
      const jsonStr = JSON.stringify(data, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = `questlog_backup_${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          const migratedData = migrateData(data);

          if (confirm('This will replace your current data. Continue?')) {
            saveStoreLocal(migratedData);
            render();
            pushToGithub(migratedData);
          }
        } catch (err) {
          alert('Invalid backup file!');
          console.error('Import error:', err);
        }
      };
      reader.readAsText(file);

      // Reset input so same file can be selected again
      event.target.value = '';
    }

    /* Search */
    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      render();
    }

    function getSearchResults() {
      if (!searchQuery) return null;

      const data = getStore();
      const results = [];
      const tabs = ['mainquest', 'sidequest', 'food', 'supplies', 'misc'];

      tabs.forEach(tab => {
        (data[tab] || []).forEach(item => {
          if (item.text.toLowerCase().includes(searchQuery) || 
              item.tag.toLowerCase().includes(searchQuery)) {
            results.push({ ...item, tab });
          }
        });
      });

      return results;
    }

    function switchTab(tabKey) {
      currentTab = tabKey;
      localStorage.setItem(ACTIVE_TAB_KEY, tabKey);

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-btn-${tabKey}`);

      render();

    function updateTagSelect() {

      const data = getStore();
      const labels = data.categoryConfig[currentTab]?.labels || DEFAULT_CATEGORY_CONFIG[currentTab].labels;

      select.innerHTML = labels.map(lbl => `<option value="${lbl}">${lbl}</option>`).join('');
      input.placeholder = TAB_PLACEHOLDERS[currentTab] || 'Enter item...';

    /* Category Management */
    function openEditLabelModal(label, tab) {
      editingLabel = label;
      editingLabelTab = tab;

      document.getElementById('edit-label-title').textContent = 'EDIT CATEGORY';
      document.getElementById('edit-label-input').value = label;
      document.getElementById('delete-label-btn').style.display = 'inline-block';
      document.getElementById('edit-label-modal').classList.add('active');
      document.getElementById('edit-label-input').focus();
    }

    function closeEditLabelModal() {
      document.getElementById('edit-label-modal').classList.remove('active');
      editingLabel = null;
      editingLabelTab = null;
    }

    function saveCategory() {
      const newLabel = document.getElementById('edit-label-input').value.trim();
      if (!newLabel || !editingLabel || !editingLabelTab) return;

      const data = getStore();
      const labels = data.categoryConfig[editingLabelTab].labels;
      const index = labels.indexOf(editingLabel);

      if (index !== -1) {
        labels[index] = newLabel;

        // Update all items with old label
        (data[editingLabelTab] || []).forEach(item => {
          if (item.tag.toLowerCase() === editingLabel.toLowerCase()) {
            item.tag = newLabel;
          }
        });

        saveAndSync(data);
      }

      closeEditLabelModal();
    }

    function deleteCategory() {
      if (!editingLabel || !editingLabelTab) return;

      const data = getStore();
      const items = (data[editingLabelTab] || []).filter(
        item => item.tag.toLowerCase() === editingLabel.toLowerCase()
      );

      if (items.length > 0) {
        if (!confirm(`This category has ${items.length} item(s). Delete them too?`)) {
          return;
        }
        // Remove items in this category
        data[editingLabelTab] = data[editingLabelTab].filter(
          item => item.tag.toLowerCase() !== editingLabel.toLowerCase()
        );
      }

      // Remove label
      data.categoryConfig[editingLabelTab].labels = data.categoryConfig[editingLabelTab].labels.filter(
        l => l !== editingLabel
      );

      saveAndSync(data);
      closeEditLabelModal();
    }

    function openAddCategoryModal() {
      document.getElementById('add-category-input').value = '';
      document.getElementById('add-category-modal').classList.add('active');
      document.getElementById('add-category-input').focus();
    }

    function closeAddCategoryModal() {
      document.getElementById('add-category-modal').classList.remove('active');
    }

    function confirmAddCategory() {
      const newLabel = document.getElementById('add-category-input').value.trim();
      if (!newLabel) return;

      const data = getStore();

      if (!data.categoryConfig[currentTab]) {
        data.categoryConfig[currentTab] = { labels: [], collapsed: {} };
      }

      // Check if already exists
      const exists = data.categoryConfig[currentTab].labels.some(
        l => l.toLowerCase() === newLabel.toLowerCase()
      );

      if (exists) {
        alert('Category already exists!');
        return;
      }

      data.categoryConfig[currentTab].labels.push(newLabel);
      saveAndSync(data);
      closeAddCategoryModal();
      updateTagSelect();
    }

    function toggleCollapse(label) {
      const data = getStore();

      if (!data.categoryConfig[currentTab].collapsed) {
        data.categoryConfig[currentTab].collapsed = {};
      }

      data.categoryConfig[currentTab].collapsed[label] = !data.categoryConfig[currentTab].collapsed[label];
      saveStoreLocal(data);
      render();
      // Don't push to GitHub for collapse state - local only preference
    }

    /* Actions */
    function addItem() {
      const input = document.getElementById('quest-input');
      const select = document.getElementById('tag-select');
      const text = input.value.trim();
      if (!text) return;

      const data = getStore();
      if (!data[currentTab]) data[currentTab] = [];

      data[currentTab].push({
        id: uid(),
        text: text,
        tag: select.value,
        completed: false,
        createdAt: Date.now()
      });

      input.value = '';
      saveAndSync(data);
    }

    function toggleItem(id) {
      const data = getStore();
      const list = data[currentTab] || [];
      const item = list.find(it => it.id === id);
      if (item) {
        item.completed = !item.completed;
        saveAndSync(data);
      }
    }

    function deleteItem(id, e) {
      e.stopPropagation();
      const data = getStore();
      data[currentTab] = (data[currentTab] || []).filter(it => it.id !== id);
      saveAndSync(data);
    }

    /* Drag & Drop */
    function onDragStart(e, id) {
      draggedId = id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', id);
      const card = e.currentTarget;
      setTimeout(() => card.classList.add('dragging'), 0);
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      document.querySelectorAll('.item-card').forEach(c => {
        c.classList.remove('drag-target-above', 'drag-target-below');
      });
      draggedId = null;
    }

    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const card = e.currentTarget;
      if (!card || card.dataset.id === draggedId) return;

      const rect = card.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;

      document.querySelectorAll('.item-card').forEach(c => {
        c.classList.remove('drag-target-above', 'drag-target-below');
      });

      if (e.clientY < mid) {
        card.classList.add('drag-target-above');
      } else {
        card.classList.add('drag-target-below');
      }
    }

    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-target-above', 'drag-target-below');
    }

    function onDrop(e, targetId) {
      e.preventDefault();
      e.stopPropagation();

      document.querySelectorAll('.item-card').forEach(c => {
        c.classList.remove('drag-target-above', 'drag-target-below');
      });

      if (!draggedId || draggedId === targetId) return;

      const data = getStore();
      const list = data[currentTab] || [];

      const dragIndex = list.findIndex(it => it.id === draggedId);
      const targetIndex = list.findIndex(it => it.id === targetId);
      if (dragIndex === -1 || targetIndex === -1) return;

      const [draggedItem] = list.splice(dragIndex, 1);
      const targetItem = list.find(it => it.id === targetId);

      if (targetItem && draggedItem.tag !== targetItem.tag) {
        draggedItem.tag = targetItem.tag;
      }

      const rect = e.currentTarget.getBoundingClientRect();
      const isAbove = e.clientY < (rect.top + rect.height / 2);
      const newIndex = list.findIndex(it => it.id === targetId);

      list.splice(isAbove ? newIndex : newIndex + 1, 0, draggedItem);
      saveAndSync(data);
    }

    function renderItemCard(item, highlight = false) {
      const tagClass = `tag-${item.tag.toLowerCase().replace(/[^a-z0-9]/g, '')}`;
      const highlightClass = highlight ? 'search-highlight' : '';
      return `
        <div class="item-card ${item.completed ? 'completed' : ''} ${highlightClass}"
             id="card-${item.id}"
             data-id="${item.id}"
             draggable="true"
             ondragstart="onDragStart(event, '${item.id}')"
             ondragend="onDragEnd(event)"
             ondragover="onDragOver(event)"
             ondragleave="onDragLeave(event)"
             ondrop="onDrop(event, '${item.id}')">
          <span class="drag-handle" title="Drag to reorder">⋮⋮</span>
          <div class="item-checkbox" onclick="toggleItem('${item.id}')">${item.completed ? '✓' : ''}</div>
          <div class="item-content" onclick="toggleItem('${item.id}')">
            <span class="item-tag ${tagClass}">${escapeHtml(item.tag)}</span>
            <span class="item-text">${escapeHtml(item.text)}</span>
          </div>
          <button class="delete-btn" title="Delete" onclick="deleteItem('${item.id}', event)">✕</button>
        </div>
      `;
    }

    function render() {
      const data = getStore();
      const labels = data.categoryConfig[currentTab]?.labels || DEFAULT_CATEGORY_CONFIG[currentTab].labels;
      const collapsed = data.categoryConfig[currentTab]?.collapsed || {};

      // Update tab counts
      const tabs = ['mainquest', 'sidequest', 'food', 'supplies', 'misc'];
      tabs.forEach(cat => {
        const activeCount = (data[cat] || []).filter(it => !it.completed).length;
        const badge = document.getElementById(`tab-count-${cat}`);
        if (badge) badge.textContent = activeCount;
      });

      // Handle search results
      const searchResults = getSearchResults();
      const searchInfo = document.getElementById('search-results-info');

      if (searchResults !== null) {
        searchInfo.textContent = `Found ${searchResults.length} item(s) matching "${searchQuery}"`;

        if (searchResults.length === 0) {
          document.getElementById('active-list-container').innerHTML = 
            '<div class="empty-state">NO MATCHING ITEMS FOUND</div>';
          document.getElementById('completed-section').style.display = 'none';
          return;
        }
      } else {
        searchInfo.textContent = '';
      }

      const currentList = data[currentTab] || [];
      const activeItems = currentList.filter(it => !it.completed);
      const completedItems = currentList.filter(it => it.completed);

      const activeContainer = document.getElementById('active-list-container');
      const completedContainer = document.getElementById('completed-list-container');
      const completedSection = document.getElementById('completed-section');
      const completedCount = document.getElementById('completed-count');

      if (activeItems.length === 0) {
        activeContainer.innerHTML = '<div class="empty-state">NO ACTIVE ITEMS IN THIS HALL</div>';
      } else {
        let html = '';
        labels.forEach(label => {
          const groupItems = activeItems.filter(it => it.tag.toLowerCase() === label.toLowerCase());
          const isCollapsed = collapsed[label] || false;
          const matchesSearch = searchQuery ? groupItems.some(it => 
            it.text.toLowerCase().includes(searchQuery) || it.tag.toLowerCase().includes(searchQuery)
          ) : true;

          if (groupItems.length > 0) {
            html += `
              <div class="label-group-block">
                <div class="label-group-header ${isCollapsed ? 'collapsed' : ''}" onclick="toggleCollapse('${escapeHtml(label)}')">
                  <div class="label-group-header-left">
                    <span class="collapse-icon">${isCollapsed ? '▶' : '▼'}</span>
                    <span>${label.toUpperCase()}</span>
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <button class="edit-label-btn" onclick="event.stopPropagation(); openEditLabelModal('${escapeHtml(label)}', '${currentTab}')">✏️</button>
                    <span>(${groupItems.length})</span>
                  </div>
                </div>
                <div class="label-group-list ${isCollapsed ? 'collapsed' : ''}" style="max-height: ${isCollapsed ? 0 : groupItems.length * 60}px;">
                  ${groupItems.map(item => {
                    const highlight = searchQuery && (
                      item.text.toLowerCase().includes(searchQuery) || 
                      item.tag.toLowerCase().includes(searchQuery)
                    );
                    return renderItemCard(item, highlight);
                  }).join('')}
                </div>
              </div>
            `;
          }
        });

        // Items with unknown labels
        const knownLabels = labels.map(l => l.toLowerCase());
        const otherItems = activeItems.filter(it => !knownLabels.includes(it.tag.toLowerCase()));
        if (otherItems.length > 0) {
          html += `
            <div class="label-group-block">
              <div class="label-group-header">
                <div class="label-group-header-left">
                  <span class="collapse-icon">▼</span>
                  <span>OTHER</span>
                </div>
                <span>(${otherItems.length})</span>
              </div>
              <div class="label-group-list">
                ${otherItems.map(item => renderItemCard(item, false)).join('')}
              </div>
            </div>
          `;
        }

        activeContainer.innerHTML = html || '<div class="empty-state">NO ACTIVE ITEMS IN THIS HALL</div>';
      }

      if (completedItems.length > 0) {
        completedSection.style.display = 'block';
        completedCount.textContent = completedItems.length;
        completedContainer.innerHTML = completedItems.map(item => renderItemCard(item, false)).join('');
      } else {
        completedSection.style.display = 'none';
        completedContainer.innerHTML = '';
      }
    }

    // Enter Key handlers
    document.getElementById('quest-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addItem();
    });

    document.getElementById('edit-label-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') saveCategory();
    });

    document.getElementById('add-category-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') confirmAddCategory();
    });

    // Startup
    switchTab(currentTab);
    syncWithGithub();
    startAutoPoll();
  </script>
</body>
</html>
