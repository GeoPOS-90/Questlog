<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Log - Main Quest, Side Quest, Provisions, Storehouse & Skills</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Press Start 2P', cursive;
      background: #1a1a2e;
      min-height: 100vh;
      padding: 20px 14px 40px;
      color: #ffd700;
    }

    .main-wrapper {
      max-width: 780px;
      margin: 0 auto;
    }

    /* Vault Header & Sync Toolbar */
    .vault-header-card {
      background: #2a2a3e;
      border: 2px solid #4a4a5e;
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header-title {
      font-size: 14px;
      color: #ffd700;
      text-shadow: 0 0 8px #ffd700, 0 0 15px #c9a227;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 8px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #4a4a5e;
      background: #2a2a3e;
      color: #888;
      cursor: pointer;
      transition: all 0.2s;
    }

    .status-badge.synced {
      color: #4ade80;
      border-color: #4ade80;
      text-shadow: 0 0 6px #4ade80;
    }

    .status-badge.syncing {
      color: #60a5fa;
      border-color: #60a5fa;
      animation: pulse 1s infinite;
    }

    .status-badge.error {
      color: #f87171;
      border-color: #f87171;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes syncPulse {
      0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
      100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
    }

    .sync-pulse {
      animation: syncPulse 1s ease-out;
    }

    .sync-time {
      font-size: 7px;
      color: #666;
      margin-top: 2px;
    }

    .btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      border: 2px solid;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-sync {
      background: #1a1a2e;
      border-color: #60a5fa;
      color: #60a5fa;
    }

    .btn-sync:hover {
      background: #60a5fa;
      color: #1a1a2e;
    }

    .btn-export {
      background: #1a1a2e;
      border-color: #4ade80;
      color: #4ade80;
    }

    .btn-export:hover {
      background: #4ade80;
      color: #1a1a2e;
    }

    .btn-import {
      background: #1a1a2e;
      border-color: #f472b6;
      color: #f472b6;
    }

    .btn-import:hover {
      background: #f472b6;
      color: #1a1a2e;
    }

    /* Search Bar */
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .search-input {
      flex: 1;
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      padding: 10px 14px;
      background: #2a2a3e;
      border: 2px solid #4a4a5e;
      border-radius: 4px;
      color: #ffd700;
      outline: none;
    }

    .search-input:focus {
      border-color: #ffd700;
    }

    .search-input::placeholder {
      color: #666;
    }

    /* Tab Navigation */
    .tab-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      padding: 10px 14px;
      background: #2a2a3e;
      border: 2px solid #4a4a5e;
      border-radius: 4px;
      color: #888;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      border-color: #ffd700;
      color: #ffd700;
    }

    .tab-btn.active {
      background: #3a3a4e;
      border-color: #ffd700;
      color: #ffd700;
      text-shadow: 0 0 8px #ffd700;
    }

    .tab-count {
      font-size: 8px;
      background: #4a4a5e;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .tab-btn.active .tab-count {
      background: #ffd700;
      color: #1a1a2e;
    }

    /* Input Area */
    .input-area {
      background: #2a2a3e;
      border: 2px solid #4a4a5e;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .input-area input,
    .input-area select {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      padding: 10px;
      background: #1a1a2e;
      border: 2px solid #4a4a5e;
      border-radius: 4px;
      color: #ffd700;
      outline: none;
    }

    .input-area input:focus,
    .input-area select:focus {
      border-color: #ffd700;
    }

    .input-area input {
      flex: 1;
      min-width: 200px;
    }

    .input-area select {
      min-width: 140px;
    }

    .input-area button {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      padding: 10px 16px;
      background: #ffd700;
      border: none;
      border-radius: 4px;
      color: #1a1a2e;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .input-area button:hover {
      background: #ffed4a;
      transform: scale(1.05);
    }

    /* Category Groups */
    .category-group {
      background: #2a2a3e;
      border: 2px solid #4a4a5e;
      border-radius: 6px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: #3a3a4e;
      cursor: pointer;
      transition: background 0.15s;
    }

    .category-header:hover {
      background: #4a4a5e;
    }

    .category-title {
      font-size: 10px;
      color: #ffd700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-title-text {
      cursor: text;
    }

    .category-title-text:hover {
      text-decoration: underline;
    }

    .category-count {
      font-size: 8px;
      color: #888;
    }

    .category-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .collapse-icon {
      font-size: 10px;
      color: #888;
      transition: transform 0.2s;
    }

    .category-group.collapsed .collapse-icon {
      transform: rotate(-90deg);
    }

    .category-group.collapsed .category-items {
      display: none;
    }

    .add-category-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      padding: 8px 12px;
      background: #2a2a3e;
      border: 2px dashed #4a4a5e;
      border-radius: 6px;
      color: #888;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      transition: all 0.15s;
    }

    .add-category-btn:hover {
      border-color: #ffd700;
      color: #ffd700;
    }

    .delete-category-btn {
      font-size: 10px;
      color: #f87171;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .category-header:hover .delete-category-btn {
      opacity: 1;
    }

    /* Item Cards */
    .category-items {
      padding: 8px;
    }

    .quest-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #1a1a2e;
      border: 2px solid #4a4a5e;
      border-radius: 4px;
      margin-bottom: 6px;
      cursor: grab;
      transition: all 0.15s ease;
    }

    .quest-item:hover {
      border-color: #ffd700;
    }

    .quest-item.completed {
      opacity: 0.5;
      border-color: #4ade80;
    }

    .quest-item.completed .item-text {
      text-decoration: line-through;
      color: #4ade80;
    }

    .quest-item.dragging {
      opacity: 0.5;
      transform: scale(1.02);
    }

    .drag-handle {
      color: #666;
      cursor: grab;
      font-size: 12px;
    }

    .item-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #4ade80;
    }

    .item-text {
      flex: 1;
      font-size: 10px;
      color: #e0e0e0;
      word-break: break-word;
    }

    .item-text mark {
      background: #ffd700;
      color: #1a1a2e;
      padding: 0 2px;
      border-radius: 2px;
    }

    .item-tag {
      font-size: 7px;
      padding: 3px 6px;
      border-radius: 3px;
      background: #4a4a5e;
      color: #ccc;
    }

    .delete-btn {
      font-size: 12px;
      color: #f87171;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .quest-item:hover .delete-btn {
      opacity: 1;
    }

    /* Skill Item Card */
    .skill-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      background: #1a1a2e;
      border: 2px solid #4a4a5e;
      border-radius: 4px;
      margin-bottom: 8px;
      transition: all 0.15s ease;
    }

    .skill-item:hover {
      border-color: #ffd700;
    }

    .skill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .skill-name {
      font-size: 10px;
      color: #e0e0e0;
    }

    .skill-rank {
      font-size: 8px;
      padding: 4px 8px;
      border-radius: 3px;
      font-weight: bold;
    }

    /* Rank Colors */
    .rank-novice { background: #6b7280; color: #fff; }
    .rank-apprentice { background: #22c55e; color: #fff; }
    .rank-initiate { background: #14b8a6; color: #fff; }
    .rank-journeyman { background: #3b82f6; color: #fff; }
    .rank-adept { background: #8b5cf6; color: #fff; }
    .rank-expert { background: #f97316; color: #fff; }
    .rank-veteran { background: #ef4444; color: #fff; }
    .rank-elite { background: #eab308; color: #1a1a2e; }
    .rank-champion { background: #06b6d4; color: #fff; text-shadow: 0 0 4px #06b6d4; }
    .rank-master { background: linear-gradient(135deg, #ffd700, #ffed4a); color: #1a1a2e; box-shadow: 0 0 8px #ffd700; }
    .rank-grandmaster { background: linear-gradient(135deg, #8b5cf6, #a855f7); color: #fff; box-shadow: 0 0 8px #8b5cf6; }
    .rank-legend { background: linear-gradient(135deg, #f97316, #fb923c); color: #fff; box-shadow: 0 0 8px #f97316; }
    .rank-mythic { background: linear-gradient(135deg, #ff0080, #7928ca, #0070f3); color: #fff; box-shadow: 0 0 12px #ff0080; animation: shimmer 2s infinite; }
    .rank-transcendent { background: linear-gradient(135deg, #e5e7eb, #f3f4f6); color: #1a1a2e; box-shadow: 0 0 12px #e5e7eb; }
    .rank-immortal { background: linear-gradient(135deg, #fef3c7, #fde68a, #fbbf24); color: #1a1a2e; box-shadow: 0 0 15px #fbbf24; }
    .rank-godlike { background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3); color: #fff; box-shadow: 0 0 20px #ffd700; animation: rainbow 3s linear infinite; }

    @keyframes shimmer {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
    }

    @keyframes rainbow {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    /* Skill border colors based on rank */
    .skill-item.tier-novice { border-color: #6b7280; }
    .skill-item.tier-apprentice { border-color: #22c55e; }
    .skill-item.tier-initiate { border-color: #14b8a6; }
    .skill-item.tier-journeyman { border-color: #3b82f6; }
    .skill-item.tier-adept { border-color: #8b5cf6; }
    .skill-item.tier-expert { border-color: #f97316; }
    .skill-item.tier-veteran { border-color: #ef4444; }
    .skill-item.tier-elite { border-color: #eab308; }
    .skill-item.tier-champion { border-color: #06b6d4; box-shadow: 0 0 6px rgba(6, 182, 212, 0.3); }
    .skill-item.tier-master { border-color: #ffd700; box-shadow: 0 0 8px rgba(255, 215, 0, 0.4); }
    .skill-item.tier-grandmaster { border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.4); }
    .skill-item.tier-legend { border-color: #f97316; box-shadow: 0 0 10px rgba(249, 115, 22, 0.4); }
    .skill-item.tier-mythic { border-color: #ff0080; box-shadow: 0 0 12px rgba(255, 0, 128, 0.5); }
    .skill-item.tier-transcendent { border-color: #e5e7eb; box-shadow: 0 0 12px rgba(229, 231, 235, 0.5); }
    .skill-item.tier-immortal { border-color: #fbbf24; box-shadow: 0 0 15px rgba(251, 191, 36, 0.5); }
    .skill-item.tier-godlike { border-color: #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); animation: rainbow-border 3s linear infinite; }

    @keyframes rainbow-border {
      0% { border-color: #ff0000; }
      16% { border-color: #ff7f00; }
      33% { border-color: #ffff00; }
      50% { border-color: #00ff00; }
      66% { border-color: #0000ff; }
      83% { border-color: #9400d3; }
      100% { border-color: #ff0000; }
    }

    .skill-progress-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .skill-level {
      font-size: 12px;
      color: #ffd700;
      min-width: 45px;
      text-align: center;
    }

    .skill-progress-bar {
      flex: 1;
      height: 10px;
      background: #4a4a5e;
      border-radius: 5px;
      overflow: hidden;
    }

    .skill-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffed4a);
      transition: width 0.3s ease;
    }

    .skill-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .skill-btn {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      width: 28px;
      height: 28px;
      background: #3a3a4e;
      border: 2px solid #4a4a5e;
      border-radius: 4px;
      color: #ffd700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .skill-btn:hover {
      background: #4a4a5e;
      border-color: #ffd700;
    }

    .skill-btn.minus:hover {
      border-color: #f87171;
      color: #f87171;
    }

    .skill-btn.plus:hover {
      border-color: #4ade80;
      color: #4ade80;
    }

    .skill-delete {
      font-size: 12px;
      color: #f87171;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s;
      margin-left: auto;
    }

    .skill-item:hover .skill-delete {
      opacity: 1;
    }

    /* No Results */
    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 10px;
    }

    .no-results-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    /* Error Display */
    .error-panel {
      background: #2a1a1a;
      border: 2px solid #f87171;
      border-radius: 4px;
      padding: 10px;
      margin-top: 10px;
      display: none;
    }

    .error-panel.show {
      display: block;
    }

    .error-panel pre {
      font-family: monospace;
      font-size: 9px;
      color: #f87171;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Hidden file input */
    #import-input {
      display: none;
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <!-- Header -->
    <div class="vault-header-card">
      <div class="header-top-row">
        <div class="header-title">⚔️ QUEST LOG VAULT</div>
        <div class="header-actions">
          <div>
            <span id="sync-status" class="status-badge">⏳ LOADING</span>
            <div id="sync-time" class="sync-time"></div>
          </div>
          <button class="btn btn-sync" onclick="syncWithGithub()">🔄 SYNC</button>
          <button class="btn btn-export" onclick="exportBackup()">📥 EXPORT</button>
          <button class="btn btn-import" onclick="document.getElementById('import-input').click()">📤 IMPORT</button>
          <input type="file" id="import-input" accept=".json" onchange="importBackup(event)">
        </div>
      </div>
      <div id="error-panel" class="error-panel">
        <pre id="error-content"></pre>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Search all quests..." oninput="handleSearch()">
    </div>

    <!-- Tab Navigation -->
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="mainquest" onclick="switchTab('mainquest')">
        ⚔️ MAIN QUEST <span class="tab-count" id="count-mainquest">0</span>
      </button>
      <button class="tab-btn" data-tab="sidequest" onclick="switchTab('sidequest')">
        📜 SIDE QUEST <span class="tab-count" id="count-sidequest">0</span>
      </button>
      <button class="tab-btn" data-tab="food" onclick="switchTab('food')">
        🍖 PROVISIONS <span class="tab-count" id="count-food">0</span>
      </button>
      <button class="tab-btn" data-tab="supplies" onclick="switchTab('supplies')">
        📦 STOREHOUSE <span class="tab-count" id="count-supplies">0</span>
      </button>
      <button class="tab-btn" data-tab="skills" onclick="switchTab('skills')">
        🎯 SKILLS <span class="tab-count" id="count-skills">0</span>
      </button>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <input type="text" id="quest-input" placeholder="Enter new quest or skill...">
      <select id="category-select"></select>
      <button onclick="addItem()">+ ADD</button>
    </div>

    <!-- Content Area -->
    <div id="content-area"></div>
  </div>

  <script>
    // ============ CONFIG ============
    const OWNER = 'GeoPOS-90';
    const REPO = 'Questlog';
    const BRANCH = 'main';
    const FILE_PATH = 'todos';

    // Split token to avoid GitHub detection
    const _t = [
      'github_pat_11B33AJB',
      'Y0Bxt04NO4rX78_RQj1eUOyJ',
      'MmmrF4SzE999qwOvtH869pPX',
      'N83i9SFRykZESQBA7Sk9GumUtS'
    ];
    const getToken = () => _t.join('');

    // ============ STATE ============
    let currentTab = 'mainquest';
    let currentSha = null;
    let lastSyncTime = null;
    let searchQuery = '';

    const DEFAULT_CATEGORY_CONFIG = {
      food: {
        labels: ['🥩 Proteins', '🥬 Vegetables', '🧀 Dairy', '🍞 Grains', '🍎 Fruits', '❄️ Frozen', '🥫 Canned', '🍪 Snacks'],
        collapsed: {}
      },
      supplies: {
        labels: ['🧹 Cleaning', '🧴 Personal Care', '📦 Household', '🐾 Pet Supplies'],
        collapsed: {}
      },
      mainquest: {
        labels: ['⚔️ Story', '🐉 Boss Battles', '🏰 Dungeons', '👑 Milestones'],
        collapsed: {}
      },
      sidequest: {
        labels: ['🗺️ Exploration', '💎 Collectibles', '🤝 Favors', '🎯 Challenges'],
        collapsed: {}
      },
      skills: {
        labels: ['⚔️ Combat', '🧙 Magic', '🛠️ Crafting', '🗣️ Social', '🏃 Physical'],
        collapsed: {}
      }
    };

    const DEFAULT_DATA = {
      food: [],
      supplies: [],
      mainquest: [],
      sidequest: [],
      skills: [],
      categoryConfig: JSON.parse(JSON.stringify(DEFAULT_CATEGORY_CONFIG)),
      meta: { lastModified: 0, version: 3 }
    };

    let store = JSON.parse(JSON.stringify(DEFAULT_DATA));

    // ============ SKILL RANKS ============
    const SKILL_RANKS = [
      { level: 1, name: 'Novice', class: 'novice' },
      { level: 4, name: 'Apprentice', class: 'apprentice' },
      { level: 7, name: 'Initiate', class: 'initiate' },
      { level: 10, name: 'Journeyman', class: 'journeyman' },
      { level: 20, name: 'Adept', class: 'adept' },
      { level: 30, name: 'Expert', class: 'expert' },
      { level: 40, name: 'Veteran', class: 'veteran' },
      { level: 50, name: 'Elite', class: 'elite' },
      { level: 60, name: 'Champion', class: 'champion' },
      { level: 70, name: 'Master', class: 'master' },
      { level: 80, name: 'Grandmaster', class: 'grandmaster' },
      { level: 90, name: 'Legend', class: 'legend' },
      { level: 100, name: 'Mythic', class: 'mythic' },
      { level: 250, name: 'Transcendent', class: 'transcendent' },
      { level: 500, name: 'Immortal', class: 'immortal' },
      { level: 1000, name: 'Godlike', class: 'godlike' }
    ];

    function getRank(level) {
      let rank = SKILL_RANKS[0];
      for (const r of SKILL_RANKS) {
        if (level >= r.level) rank = r;
        else break;
      }
      return rank;
    }

    function getNextRank(level) {
      for (const r of SKILL_RANKS) {
        if (level < r.level) return r;
      }
      return null;
    }

    function getProgressToNextRank(level) {
      const current = getRank(level);
      const next = getNextRank(level);
      if (!next) return 100;
      const progress = ((level - current.level) / (next.level - current.level)) * 100;
      return Math.min(100, Math.max(0, progress));
    }

    // ============ LOCAL STORAGE ============
    function loadStoreLocal() {
      try {
        const saved = localStorage.getItem('questlog_store');
        if (saved) {
          const parsed = JSON.parse(saved);
          store = { ...DEFAULT_DATA, ...parsed };
          if (!store.categoryConfig) store.categoryConfig = JSON.parse(JSON.stringify(DEFAULT_CATEGORY_CONFIG));
          if (!store.skills) store.skills = [];
          if (!store.mainquest) store.mainquest = [];
          if (!store.sidequest) store.sidequest = [];
        }
      } catch (e) {
        console.error('Failed to load local store:', e);
      }
    }

    function saveStoreLocal(data) {
      store = { ...DEFAULT_DATA, ...data };
      localStorage.setItem('questlog_store', JSON.stringify(store));
    }

    // ============ GITHUB SYNC ============
    function updateStatus(type, text) {
      const badge = document.getElementById('sync-status');
      badge.className = 'status-badge ' + type;
      badge.textContent = text;

      if (type === 'synced') {
        lastSyncTime = new Date();
        updateSyncTime();
        badge.classList.add('sync-pulse');
        setTimeout(() => badge.classList.remove('sync-pulse'), 1000);
      }
    }

    function updateSyncTime() {
      const el = document.getElementById('sync-time');
      if (!lastSyncTime) {
        el.textContent = '';
        return;
      }
      const diff = Math.floor((new Date() - lastSyncTime) / 1000);
      if (diff < 60) el.textContent = 'Last synced: just now';
      else if (diff < 3600) el.textContent = `Last synced: ${Math.floor(diff / 60)} min ago`;
      else el.textContent = `Last synced: ${Math.floor(diff / 3600)} hr ago`;
    }

    setInterval(updateSyncTime, 30000);

    function showError(error) {
      const panel = document.getElementById('error-panel');
      const content = document.getElementById('error-content');
      content.textContent = JSON.stringify(error, null, 2);
      panel.classList.add('show');
    }

    function hideError() {
      document.getElementById('error-panel').classList.remove('show');
    }

    async function syncWithGithub() {
      updateStatus('syncing', '🔄 SYNCING');
      hideError();

      try {
        const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}?ref=${BRANCH}`;
        const response = await fetch(url, {
          headers: {
            'Authorization': `Bearer ${getToken()}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (response.status === 404) {
          // File doesn't exist, create it
          await pushToGithub();
          return;
        }

        if (!response.ok) {
          const errData = await response.json();
          throw { status: response.status, statusText: response.statusText, url, response: errData };
        }

        const data = await response.json();
        currentSha = data.sha;

        const remoteContent = JSON.parse(atob(data.content));
        const localData = { ...store };

        // Silent merge: combine local and remote
        const mergedData = mergeData(localData, remoteContent);
        mergedData.meta = { lastModified: Date.now(), version: 3 };

        saveStoreLocal(mergedData);

        // Push merged data back
        await pushToGithub();

        render();
        updateStatus('synced', '☁️ SYNCED');

      } catch (error) {
        console.error('Sync failed:', error);
        updateStatus('error', '⚠️ SYNC ERROR');
        showError(error);
      }
    }

    function mergeData(local, remote) {
      const merged = { ...DEFAULT_DATA };

      // Merge arrays for each tab (dedupe by id)
      const tabs = ['food', 'supplies', 'mainquest', 'sidequest', 'skills'];
      for (const tab of tabs) {
        const localItems = local[tab] || [];
        const remoteItems = remote[tab] || [];
        const itemMap = new Map();

        for (const item of remoteItems) {
          if (item.id) itemMap.set(item.id, item);
        }
        for (const item of localItems) {
          if (item.id) itemMap.set(item.id, item);
        }

        merged[tab] = Array.from(itemMap.values());
      }

      // Merge categoryConfig
      merged.categoryConfig = { ...DEFAULT_CATEGORY_CONFIG };
      for (const tab of tabs) {
        const localConfig = local.categoryConfig?.[tab] || {};
        const remoteConfig = remote.categoryConfig?.[tab] || {};

        const localLabels = localConfig.labels || [];
        const remoteLabels = remoteConfig.labels || [];
        const labelSet = new Set([...remoteLabels, ...localLabels]);
        merged.categoryConfig[tab] = {
          labels: Array.from(labelSet),
          collapsed: { ...remoteConfig.collapsed, ...localConfig.collapsed }
        };
      }

      return merged;
    }

    async function pushToGithub() {
      const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;
      store.meta.lastModified = Date.now();

      const body = {
        message: 'Update quest log',
        content: btoa(unescape(encodeURIComponent(JSON.stringify(store, null, 2)))),
        branch: BRANCH
      };

      if (currentSha) body.sha = currentSha;

      const response = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${getToken()}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        const errData = await response.json();
        throw { status: response.status, statusText: response.statusText, url, response: errData };
      }

      const data = await response.json();
      currentSha = data.content.sha;
    }

    // ============ AUTO POLL ============
    function startAutoPoll() {
      setInterval(() => {
        syncWithGithub();
      }, 30000);
    }

    // ============ EXPORT / IMPORT ============
    function exportBackup() {
      const data = JSON.stringify(store, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `questlog_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          saveStoreLocal(data);
          render();
          pushToGithub().then(() => {
            updateStatus('synced', '☁️ SYNCED');
          });
        } catch (err) {
          alert('Invalid backup file');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // ============ SEARCH ============
    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      render();
    }

    function highlightText(text, query) {
      if (!query) return text;
      const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(regex, '<mark>$1</mark>');
    }

    // ============ TABS ============
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      populateCategorySelect();
      render();
    }

    function updateCounts() {
      const tabs = ['food', 'supplies', 'mainquest', 'sidequest', 'skills'];
      for (const tab of tabs) {
        const count = (store[tab] || []).filter(i => !i.completed).length;
        document.getElementById(`count-${tab}`).textContent = count;
      }
    }

    // ============ CATEGORIES ============
    function getCategories(tab) {
      return store.categoryConfig?.[tab]?.labels || DEFAULT_CATEGORY_CONFIG[tab]?.labels || [];
    }

    function isCollapsed(tab, category) {
      return store.categoryConfig?.[tab]?.collapsed?.[category] || false;
    }

    function toggleCollapse(tab, category) {
      if (!store.categoryConfig[tab]) store.categoryConfig[tab] = { labels: [], collapsed: {} };
      if (!store.categoryConfig[tab].collapsed) store.categoryConfig[tab].collapsed = {};
      store.categoryConfig[tab].collapsed[category] = !store.categoryConfig[tab].collapsed[category];
      saveStoreLocal(store);
      render();
      pushToGithub();
    }

    function populateCategorySelect() {
      const select = document.getElementById('category-select');
      const categories = getCategories(currentTab);
      select.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function addCategory() {
      const name = prompt('Enter new category name (with emoji):');
      if (!name || !name.trim()) return;

      if (!store.categoryConfig[currentTab]) {
        store.categoryConfig[currentTab] = { labels: [], collapsed: {} };
      }

      if (!store.categoryConfig[currentTab].labels.includes(name.trim())) {
        store.categoryConfig[currentTab].labels.push(name.trim());
        saveStoreLocal(store);
        populateCategorySelect();
        render();
        pushToGithub();
      }
    }

    function renameCategory(oldName) {
      const newName = prompt('Rename category:', oldName);
      if (!newName || !newName.trim() || newName === oldName) return;

      const labels = store.categoryConfig[currentTab].labels;
      const idx = labels.indexOf(oldName);
      if (idx > -1) {
        labels[idx] = newName.trim();

        // Update items with old category
        store[currentTab].forEach(item => {
          if (item.category === oldName) item.category = newName.trim();
        });

        saveStoreLocal(store);
        populateCategorySelect();
        render();
        pushToGithub();
      }
    }

    function deleteCategory(name) {
      const items = store[currentTab].filter(i => i.category === name);
      if (items.length > 0) {
        alert('Cannot delete category with items. Move or delete items first.');
        return;
      }

      if (!confirm(`Delete category "${name}"?`)) return;

      const labels = store.categoryConfig[currentTab].labels;
      const idx = labels.indexOf(name);
      if (idx > -1) {
        labels.splice(idx, 1);
        saveStoreLocal(store);
        populateCategorySelect();
        render();
        pushToGithub();
      }
    }

    // ============ ITEMS ============
    function addItem() {
      const input = document.getElementById('quest-input');
      const select = document.getElementById('category-select');
      const text = input.value.trim();
      const category = select.value;

      if (!text) return;

      if (currentTab === 'skills') {
        store.skills.push({
          id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
          name: text,
          category: category,
          level: 1
        });
      } else {
        store[currentTab].push({
          id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
          text: text,
          category: category,
          completed: false
        });
      }

      saveStoreLocal(store);
      input.value = '';
      render();
      pushToGithub();
    }

    function toggleItem(id) {
      const item = store[currentTab].find(i => i.id === id);
      if (item) {
        item.completed = !item.completed;
        saveStoreLocal(store);
        render();
        pushToGithub();
      }
    }

    function deleteItem(id) {
      store[currentTab] = store[currentTab].filter(i => i.id !== id);
      saveStoreLocal(store);
      render();
      pushToGithub();
    }

    function updateSkillLevel(id, delta) {
      const skill = store.skills.find(s => s.id === id);
      if (skill) {
        skill.level = Math.max(1, Math.min(1000, skill.level + delta));
        saveStoreLocal(store);
        render();
        pushToGithub();
      }
    }

    // ============ DRAG & DROP ============
    let draggedItem = null;

    function handleDragStart(e, id) {
      draggedItem = id;
      e.target.classList.add('dragging');
    }

    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
      draggedItem = null;
    }

    function handleDragOver(e) {
      e.preventDefault();
    }

    function handleDrop(e, targetId, category) {
      e.preventDefault();
      if (!draggedItem || draggedItem === targetId) return;

      const items = store[currentTab];
      const draggedIdx = items.findIndex(i => i.id === draggedItem);
      const targetIdx = items.findIndex(i => i.id === targetId);

      if (draggedIdx > -1 && targetIdx > -1) {
        const [removed] = items.splice(draggedIdx, 1);
        removed.category = category;
        items.splice(targetIdx, 0, removed);
        saveStoreLocal(store);
        render();
        pushToGithub();
      }
    }

    // ============ RENDER ============
    function render() {
      const container = document.getElementById('content-area');
      const categories = getCategories(currentTab);
      const items = store[currentTab] || [];

      // Filter by search
      let filteredItems = items;
      if (searchQuery) {
        filteredItems = items.filter(item => {
          const text = currentTab === 'skills' ? item.name : item.text;
          return text.toLowerCase().includes(searchQuery) ||
                 item.category.toLowerCase().includes(searchQuery);
        });
      }

      // Group by category
      const grouped = {};
      for (const cat of categories) {
        grouped[cat] = filteredItems.filter(i => i.category === cat);
      }

      // Check if any results
      const hasResults = filteredItems.length > 0 || !searchQuery;

      let html = '';

      if (!hasResults) {
        html = `
          <div class="no-results">
            <div class="no-results-icon">🔍</div>
            <div>No results found for "${searchQuery}"</div>
          </div>
        `;
      } else {
        // Add category button
        html += `<button class="add-category-btn" onclick="addCategory()">+ ADD CATEGORY</button>`;

        for (const cat of categories) {
          const catItems = grouped[cat] || [];
          const collapsed = isCollapsed(currentTab, cat);
          const catClass = normalizeClass(cat);

          html += `
            <div class="category-group ${collapsed ? 'collapsed' : ''}" data-category="${cat}">
              <div class="category-header" onclick="toggleCollapse('${currentTab}', '${cat}')">
                <div class="category-title">
                  <span class="category-title-text" onclick="event.stopPropagation(); renameCategory('${cat}')">${cat}</span>
                  <span class="category-count">(${catItems.length})</span>
                </div>
                <div class="category-actions">
                  <span class="delete-category-btn" onclick="event.stopPropagation(); deleteCategory('${cat}')">🗑️</span>
                  <span class="collapse-icon">${collapsed ? '▶' : '▼'}</span>
                </div>
              </div>
              <div class="category-items">
          `;

          if (currentTab === 'skills') {
            for (const skill of catItems) {
              const rank = getRank(skill.level);
              const progress = getProgressToNextRank(skill.level);
              const nextRank = getNextRank(skill.level);
              const progressLabel = nextRank ? `${skill.level} → ${nextRank.level} (${nextRank.name})` : 'MAX LEVEL';

              html += `
                <div class="skill-item tier-${rank.class}">
                  <div class="skill-header">
                    <span class="skill-name">${highlightText(skill.name, searchQuery)}</span>
                    <span class="skill-rank rank-${rank.class}">${rank.name}</span>
                    <span class="skill-delete" onclick="deleteItem('${skill.id}')">🗑️</span>
                  </div>
                  <div class="skill-progress-container">
                    <div class="skill-controls">
                      <button class="skill-btn minus" onclick="updateSkillLevel('${skill.id}', -1)">-</button>
                      <span class="skill-level">${skill.level}</span>
                      <button class="skill-btn plus" onclick="updateSkillLevel('${skill.id}', 1)">+</button>
                    </div>
                    <div class="skill-progress-bar" title="${progressLabel}">
                      <div class="skill-progress-fill" style="width: ${progress}%"></div>
                    </div>
                  </div>
                </div>
              `;
            }
          } else {
            for (const item of catItems) {
              html += `
                <div class="quest-item ${item.completed ? 'completed' : ''}"
                     draggable="true"
                     ondragstart="handleDragStart(event, '${item.id}')"
                     ondragend="handleDragEnd(event)"
                     ondragover="handleDragOver(event)"
                     ondrop="handleDrop(event, '${item.id}', '${cat}')">
                  <span class="drag-handle">☰</span>
                  <input type="checkbox" class="item-checkbox"
                         ${item.completed ? 'checked' : ''}
                         onchange="toggleItem('${item.id}')">
                  <span class="item-text">${highlightText(item.text, searchQuery)}</span>
                  <span class="item-tag tag-${catClass}">${cat}</span>
                  <span class="delete-btn" onclick="deleteItem('${item.id}')">🗑️</span>
                </div>
              `;
            }
          }

          html += `
              </div>
            </div>
          `;
        }
      }

      container.innerHTML = html;
      updateCounts();
    }

    function normalizeClass(label) {
      return label.toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    // ============ INIT ============
    document.getElementById('quest-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addItem();
    });

    loadStoreLocal();
    switchTab(currentTab);
    syncWithGithub();
    startAutoPoll();
  </script>
</body>
</html>
